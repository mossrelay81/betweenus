   const profile=parse(JSON.parse(await readFile(file)));
   if(el.id==='own'){
    if((Object.keys(state.answers).length||Object.keys(state.reflections).length)&&!confirm('Replace your current answers with this file?')){el.value='';return}
    state=profile;persist();
   }else{peer=profile;filter='Answered topics';search=''}
   status='Responses loaded.';render();
  }catch(error){el.value='';message(error instanceof SyntaxError?'This file is not valid JSON.':error.message)}
 }
});
let sheet=0;
const viewport=$('#window');
function layoutSheets(){
 const visual=window.visualViewport;
 document.documentElement.style.setProperty('--visible',(visual?visual.height:window.innerHeight)+'px');
 const step=viewport.clientWidth+16;
 const count=Math.max(1,Math.ceil((viewport.scrollWidth-viewport.clientWidth-1)/step)+1);
 sheet=Math.max(0,Math.min(sheet,count-1));
 viewport.scrollLeft=sheet*step;
 $('#prevSheet').disabled=sheet===0;
 $('#nextSheet').disabled=sheet===count-1;
 $('#sheetCount').textContent=(sheet+1)+' / '+count;
}
$('#prevSheet').onclick=()=>{sheet--;layoutSheets()};
$('#nextSheet').onclick=()=>{sheet++;layoutSheets()};
window.addEventListener('resize',layoutSheets);
window.visualViewport?.addEventListener('resize',layoutSheets);
new MutationObserver(()=>requestAnimationFrame(layoutSheets)).observe($('#sheets'),{subtree:true,childList:true,attributes:true,attributeFilter:['open']});
viewport.addEventListener('focusin',event=>{
 const offset=event.target.getBoundingClientRect().left-viewport.getBoundingClientRect().left+viewport.scrollLeft;
 sheet=Math.max(0,Math.floor((offset+1)/(viewport.clientWidth+16)));
 requestAnimationFrame(layoutSheets);
});
render();
</script></html>
