 }
 const reflections={};
 reflection.forEach((_,i)=>{const v=raw.reflections?.[i];if(typeof v==='string')reflections[i]=v.slice(0,3000)});

function download(name,type,content){
 if(exportUrl)URL.revokeObjectURL(exportUrl);
 const file=new Blob([content],{type});
 const url=URL.createObjectURL(file);
 exportUrl=url;
 const links=document.createElement('div');
 links.className='actions gap';
 const link=document.createElement('a');
 link.href=url;link.download=name;link.textContent='Download '+name;
 links.append(link);
 const preview=document.createElement('a');
 preview.href=url;preview.target='_blank';preview.rel='noopener';
 preview.textContent='Open file to save or share';
 links.append(preview);
 if(typeof File==='function'&&typeof navigator.canShare==='function'&&typeof navigator.share==='function'){
  const attachment=new File([file],name,{type:type.split(';')[0]});
  if(navigator.canShare({files:[attachment]})){
   const share=document.createElement('button');
   share.textContent='Share or Save to Files';
   share.addEventListener('click',async()=>{
    try{await navigator.share({files:[attachment]})}
    catch(error){if(error.name!=='AbortError')message('Sharing was unavailable. Use the download link instead.')}
   });
   links.append(share);
  }
 }
 message('Your export is ready. On iPhone or iPad, choose Share or Save to Files if available.');
 $('#message').append(links);
 links.firstElementChild.focus();
}
function readFile(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(Error('This file could not be read. Save it to Files and select it again.'));
  reader.readAsText(file);
 });
}

 const values=a=>!a||a.interest==='Prefer not to answer'?['','','']:[a.interest,a.history,a.priority];
 compareRows().forEach(r=>data.push([r.section,r.label,r.group,...values(r.a),...values(r.b)]));
 return '\uFEFF'+data.map(row=>row.map(csvCell).join(',')).join('\r\n');
}
function focusSection(){const title=$('#section-title');title?.focus();title?.scrollIntoView({block:'start'})}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.view){page=b.dataset.view;status='';render();if(page==='survey')focusSection();return}
 if(b.dataset.step){state.section=Number(state.section)+Number(b.dataset.step);persist();render();focusSection();return}
 if(b.id==='export'){download('between-us-responses.json','application/json',JSON.stringify(packet($('#notes').checked),null,2));}
 if(b.id==='compareExport'){download('between-us-comparison.csv','text/csv;charset=utf-8',csv());}
 if(b.id==='print')window.print();
 if(b.id==='removePeer'){peer=null;filter='All topics';search='';render()}
 if(b.id==='clear'&&confirm('Clear the answers and draft from this browser? Your downloaded exports will still exist.')){
  try{localStorage.removeItem(key)}catch{}remembering=false;state=blank();peer=null;filter='All topics';search='';status='Local answers cleared.';render();
 }
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='name'){state.name=el.value;persist()}
 if(el.id==='search'){search=el.value;$('#rows').innerHTML=compared(compareRows())}
 if(el.dataset.reflection!==undefined){state.reflections[el.dataset.reflection]=el.value;persist()}
 if(el.dataset.field){
  const id=el.closest('article').dataset.id;
  (state.answers[id]??={})[el.dataset.field]=el.value;
  persist();
  $('#progress').value=answered(state);$('#count').textContent=answered(state)+' of '+items.length+' topics answered';
 }
});
document.addEventListener('change',async event=>{
 const el=event.target;
 if(el.id==='jump'){state.section=Number(el.value);persist();render();focusSection()}
 if(el.id==='filter'){filter=el.value;$('#rows').innerHTML=compared(compareRows())}
 if(el.id==='remember'){
  remembering=el.checked;
  if(remembering){persist();el.checked=remembering}
  else{try{localStorage.removeItem(key)}catch{}}
 }
 if((el.id==='own'||el.id==='peer')&&el.files?.[0]){
  try{
   const file=el.files[0];if(file.size>5000000)throw Error('This file is too large for a response export.');
   const profile=parse(JSON.parse(await readFile(file)));
   if(el.id==='own'){
    if((Object.keys(state.answers).length||Object.keys(state.reflections).length)&&!confirm('Replace your current answers with this file?')){el.value='';return}
    state=profile;persist();
   }else{peer=profile;filter='All topics';search=''}
   status='Responses loaded.';render();
  }catch(error){el.value='';message(error instanceof SyntaxError?'This file is not valid JSON.':error.message)}
 }
});
render();
</script></html>
